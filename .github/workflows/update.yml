name: update-subscriptions

# 【2026-10-16】停用定时触发（原 cron: 0 */6 * * *）。
# 原因：本地 update_sub.py 每小时拉源 + sing-box 实测，质量更高；
# Actions 侧的 scripts/update.py 不做测速，定时跑只会用低质量聚合结果覆盖本地实测成品，
# 且每次 push 都触发一轮 Pages 构建（Pages 是本仓库的首选订阅通道，legacy 构建 push 即构建）。
# 保留 workflow_dispatch 作为本地服务器故障时的人工应急通道。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet pyyaml
      - name: Run updater
        env:
          SUB_SOURCES: ${{ secrets.SUB_SOURCES }}
        run: python scripts/update.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto update subscriptions [skip ci]"
          # 远端可能已被本地脚本推进，先 rebase 再推，失败自动重试 3 次
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "第 $i 次推送失败，5 秒后重试..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "推送连续失败，请人工检查"; exit 1
