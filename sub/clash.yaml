# ============================================
#  sync-hub 订阅输出 · Clash 配置
#  repo: https://github.com/wanerlin/sync-hub
# ============================================
#  当前为【占位版本】：仓库尚未配置 Secret `SUB_SOURCES`，
#  因此聚合脚本未产出任何节点。
#
#  配置步骤：
#    1) Settings -> Secrets and variables -> Actions -> New repository secret
#       Name : SUB_SOURCES
#       Value: ["https://你的机场订阅链接"]   (JSON 数组)
#    2) Actions -> update-subscriptions -> Run workflow
#    3) 等待 1 分钟后本文件会被自动覆盖为真实节点
# ============================================

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info

external-controller: 127.0.0.1:9090

proxies: []

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT
      - REJECT

rules:
  - MATCH,DIRECT