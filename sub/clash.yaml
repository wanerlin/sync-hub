  uuid: ebdf87e8-4f75-4b84-94e0-65ce4894993a
  tls: true
  network: tcp
  servername: st.avito.ru
  reality-opts:
    public-key: 3_Qy1SAtWfbiQbznyhlXxJtqB-5QQ46VF1Uz2h5A7Q4
    short-id: 2dc17935
  flow: xtls-rprx-vision
  client-fingerprint: chrome
proxy-groups:
- name: 🚀 节点选择
