  tolerance: 80
- name: 🔯 故障转移
  type: fallback
  proxies:
  - '美国+V2CROSS.COM #22'
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🇺🇸 美国
  type: url-test
  proxies:
  - '美国+V2CROSS.COM #22'
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 80
- name: 🎯 全球直连
