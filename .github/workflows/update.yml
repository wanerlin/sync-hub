name: update-subscriptions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet pyyaml
      - name: Run updater
        env:
          SUB_SOURCES: ${{ secrets.SUB_SOURCES }}
        run: python scripts/update.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/
          git diff --cached --quiet && echo "无变化" || git commit -m "chore: auto update subscriptions [skip ci]"
          git push
